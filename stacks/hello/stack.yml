version: '3.8'

services:
  nginx:
    image: nginx@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    configs:
      - source: hello_index
        target: /usr/share/nginx/html/index.html
    networks: [web]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      labels:
        traefik.enable: 'true'
        traefik.swarm.network: web
        traefik.http.routers.hello.rule: Host(`hello.schedoodle.com`)
        traefik.http.routers.hello.entrypoints: web
        traefik.http.routers.hello.service: hello
        traefik.http.services.hello.loadbalancer.server.port: '80'
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  web:
    external: true

configs:
  hello_index:
    external: true
    name: hello_index_v1
