---
- name: Set up the Swarm manager
  hosts: swarm_managers
  become: true
  pre_tasks:
    - name: Require Ubuntu 24.04 on x86_64
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: This playbook targets the Ubuntu 24.04 amd64 Swarm server.

  tasks:
    - name: Set the server hostname
      ansible.builtin.hostname:
        name: '{{ inventory_hostname }}'

    - name: Preserve hostname across cloud-init boots
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-hostname.cfg
        owner: root
        group: root
        mode: '0644'
        content: "preserve_hostname: true\n"

    - name: Resolve the local hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: '127.0.1.1 {{ inventory_hostname }}'

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, python3-debian]
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        lock_timeout: 300
      tags: [qemu]

    - name: Check for the Proxmox guest-agent channel
      ansible.builtin.stat:
        path: /dev/virtio-ports/org.qemu.guest_agent.0
      register: qemu_agent_channel
      tags: [qemu]

    # Ubuntu's agent unit is static and starts through its virtio device.
    - name: Start QEMU guest agent when its channel is available
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
      when: qemu_agent_channel.stat.exists
      tags: [qemu]

    - name: Explain missing guest-agent channel
      ansible.builtin.debug:
        msg: 'Enable the agent block in terraform/swarm.tf, apply, then fully stop/start the VM and rerun this playbook.'
      when: not qemu_agent_channel.stat.exists
      tags: [qemu]

    - name: Install automatic security update support
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        lock_timeout: 300
      tags: [security_updates]

    - name: Configure daily security updates without automatic reboots
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-swarm-security-updates
        owner: root
        group: root
        mode: '0644'
        content: |
          // Managed by Ansible.
          APT::Periodic::Enable "1";
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          #clear Unattended-Upgrade::Allowed-Origins;
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
      tags: [security_updates]

    - name: Enable daily APT update timers
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      tags: [security_updates]

    - name: Create APT key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker package signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      tags: [docker]

    - name: Configure Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: [noble]
        components: [stable]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/docker.asc
      register: docker_repository
      tags: [docker]

    - name: Install Docker Engine, Compose, and Buildx
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - docker-buildx-plugin
        state: present
        update_cache: '{{ docker_repository.changed }}'
        lock_timeout: 300
      tags: [docker]

    - name: Enable Docker and containerd at boot
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - containerd
        - docker
      tags: [docker]

    - name: Ensure the Docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      tags: [docker]

    - name: Read Docker group membership
      ansible.builtin.getent:
        database: group
        key: docker
      tags: [docker]

    - name: Require sudo for hillbillydev Docker access
      ansible.builtin.command:
        argv: [gpasswd, --delete, hillbillydev, docker]
      when: "'hillbillydev' in ansible_facts.getent_group['docker'][2].split(',')"
      tags: [docker]

    - name: Read current Swarm state
      ansible.builtin.command:
        argv: [docker, info, --format, '{{ "{{json .Swarm}}" }}']
      register: swarm_state
      changed_when: false
      check_mode: false

    - name: Require an inactive node or the expected manager
      ansible.builtin.assert:
        that:
          - >-
            (swarm_state.stdout | from_json).LocalNodeState == 'inactive'
            or ((swarm_state.stdout | from_json).LocalNodeState == 'active'
            and (swarm_state.stdout | from_json).ControlAvailable
            and (swarm_state.stdout | from_json).NodeAddr == swarm_advertise_addr)
        fail_msg: The node already has an unexpected Swarm state; inspect it before proceeding.

    - name: Initialize the Swarm manager
      ansible.builtin.command:
        argv: [docker, swarm, init, --advertise-addr, '{{ swarm_advertise_addr }}', --listen-addr, '{{ swarm_advertise_addr }}:2377']
      when: (swarm_state.stdout | from_json).LocalNodeState == 'inactive'
      no_log: true

    - name: Verify manager state
      ansible.builtin.command:
        argv: [docker, node, ls]
      changed_when: false
      when: not ansible_check_mode
